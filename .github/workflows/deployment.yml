name: Deploy
on: [push, workflow_dispatch]
jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with: 
          node-version: 20
      - name: Install dependencies
        run: yarn install
      - name: Build project
        run: yarn build
      - name: Deploy
        run: echo "Deploying...."
